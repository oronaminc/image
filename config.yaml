# =====================================================================
#  Image Collector  ·  설정 파일 (블로그 포스팅용, 확장판)
#  - 36개 카테고리 × 검색어로 상업적 사용 가능한 무료 이미지를 모읍니다.
#  - 무료 소스는 영어 색인이 풍부하므로 검색어는 영어로 둡니다.
#    (카테고리 이름 옆 주석이 한국어 블로그 주제입니다.)
#  - 요청 간격은 소스별로 자동 최적화됩니다(Openverse 20/분, Pixabay 100/분 등).
# =====================================================================

storage:
  images_dir: images
  thumbnails_dir: thumbnails
  database: library.db
  thumbnail_size: 400

collection:
  default_source: pixabay       # 블로그용 기본(표기 불필요). 키 없으면 openverse
  license_type: commercial      # commercial | commercial,modification
  order: latest                 # (Pixabay) latest=최신 업로드순 | popular=인기순
  safe_search: true
  per_category_limit: 40        # 검색어당 수집 개수
  min_width: 600
  min_height: 400
  request_delay: 1.0            # 폴백값(소스별 rate_delay 가 우선)
  near_dup_threshold: 0
  user_agent: "ImageCollector/1.0 (+https://github.com/oronaminc/image)"

