# =====================================================================
#  Image Collector  ·  설정 파일 (블로그 포스팅용)
#  - 카테고리별 검색어로 상업적 사용 가능한 무료 이미지를 모읍니다.
#  - 무료 이미지 소스는 영어 색인이 훨씬 풍부하므로 검색어는 영어로 둡니다.
#    (카테고리 이름 옆 주석이 한국어 블로그 주제입니다.)
# =====================================================================

storage:
  images_dir: images
  thumbnails_dir: thumbnails
  database: library.db
  thumbnail_size: 400

collection:
  default_source: pixabay      # 블로그용 기본(표기 불필요). 키 없으면 openverse 로 변경
  license_type: commercial      # commercial | commercial,modification
  safe_search: true
  per_category_limit: 12        # 검색어당 수집 개수
  min_width: 600
  min_height: 400
  # Openverse 익명 한도(분당 20회)를 지키려면 4초 이상 권장. (API 키 등록 시 낮춰도 됨)
  request_delay: 4.0
  near_dup_threshold: 0
  user_agent: "ImageCollector/1.0 (+https://github.com/oronaminc/image)"

